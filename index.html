<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Révise avec moi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    header {
      background: #ffffff;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #666;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #64748b;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 12px;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }

    #result {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .success {
      color: #166534;
      background: #dcfce7;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Révise avec moi</h1>
  <p>Transforme tes cours en fiches de révision</p>
</header>

<main>

  <section class="card">
    <h2>📸 Mon cours</h2>

    <p>
      Prends une photo de ton cours ou choisis une image dans tes photos.
    </p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img id="preview" alt="Aperçu du cours">

    <button id="readButton" disabled>
      🤖 Comprendre mon cours
    </button>

    <div id="loading">
      ⏳ L’IA analyse ton cours...<br>
      Cela peut prendre quelques secondes.
    </div>

    <div id="message"></div>
  </section>

  <section class="card hidden" id="resultCard">
    <h2>📝 Mon cours compris</h2>

    <div id="result"></div>
  </section>

  <section class="card hidden" id="revisionCard">
    <h2>📚 Ma fiche de révision</h2>

    <div id="revision"></div>
  </section>

  <section class="card hidden" id="questionsCard">
    <h2>❓ Questions pour réviser</h2>

    <div id="questions"></div>
  </section>

  <section class="card">
    <h2>📖 Mes notes</h2>

    <textarea
      id="notes"
      placeholder="Écris tes propres notes ici..."
    ></textarea>

    <button class="secondary" id="saveNotes">
      💾 Enregistrer mes notes
    </button>

    <div id="notesMessage"></div>
  </section>

</main>

<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const readButton = document.getElementById("readButton");

  const loading = document.getElementById("loading");
  const message = document.getElementById("message");

  const resultCard = document.getElementById("resultCard");
  const revisionCard = document.getElementById("revisionCard");
  const questionsCard = document.getElementById("questionsCard");

  const result = document.getElementById("result");
  const revision = document.getElementById("revision");
  const questions = document.getElementById("questions");

  const notes = document.getElementById("notes");
  const saveNotes = document.getElementById("saveNotes");
  const notesMessage = document.getElementById("notesMessage");

  let selectedFile = null;

  imageInput.addEventListener("change", function () {

    selectedFile = this.files[0];

    if (!selectedFile) {
      readButton.disabled = true;
      preview.style.display = "none";
      return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
      preview.src = event.target.result;
      preview.style.display = "block";
    };

    reader.readAsDataURL(selectedFile);

    readButton.disabled = false;
    message.innerHTML = "";
  });


  function resizeImage(file) {

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

          const maxSize = 1600;

          let width = img.width;
          let height = img.height;

          if (width > maxSize || height > maxSize) {

            if (width > height) {
              height = Math.round(height * maxSize / width);
              width = maxSize;
            } else {
              width = Math.round(width * maxSize / height);
              height = maxSize;
            }
          }

          const canvas = document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          ctx.drawImage(img, 0, 0, width, height);

          const compressedImage =
            canvas.toDataURL("image/jpeg", 0.75);

          resolve(compressedImage);
        };

        img.onerror = reject;

        img.src = event.target.result;
      };

      reader.onerror = reject;

      reader.readAsDataURL(file);
    });
  }


  readButton.addEventListener("click", async function() {

    if (!selectedFile) {
      return;
    }

    readButton.disabled = true;

    loading.style.display = "block";
    message.innerHTML = "";

    resultCard.classList.add("hidden");
    revisionCard.classList.add("hidden");
    questionsCard.classList.add("hidden");

    try {

      const image = await resizeImage(selectedFile);

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          image: image
        })
      });


      const data = await response.json();


      if (!response.ok) {

        throw new Error(
          data.error || "Une erreur est survenue."
        );
      }


      if (!data.text) {

        throw new Error(
          "L'IA n'a pas retourné de texte."
        );
      }


      result.textContent = data.text;

      resultCard.classList.remove("hidden");


      revision.innerHTML =
        "<p>À partir de ton cours, voici les éléments importants à retenir :</p>" +
        "<p>" + escapeHtml(data.text) + "</p>";

      revisionCard.classList.remove("hidden");


      questions.innerHTML =
        "<p>Relis ton cours puis essaie de répondre à ces questions :</p>" +
        "<ol>" +
        "<li>Quels sont les principaux éléments à retenir ?</li>" +
        "<li>Peux-tu expliquer le sujet avec tes propres mots ?</li>" +
        "<li>Quels sont les mots ou notions importantes ?</li>" +
        "</ol>";

      questionsCard.classList.remove("hidden");


      message.innerHTML =
        '<div class="success">✅ Ton cours a été analysé !</div>';

    }

    catch (error) {

      console.error(error);

      message.innerHTML =
        '<div class="error">❌ ' +
        escapeHtml(error.message) +
        '</div>';
    }

    finally {

      loading.style.display = "none";

      readButton.disabled = false;
    }

  });


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  notes.value =
    localStorage.getItem("revise_notes") || "";


  saveNotes.addEventListener("click", function() {

    localStorage.setItem(
      "revise_notes",
      notes.value
    );

    notesMessage.innerHTML =
      '<div class="success">✅ Notes enregistrées !</div>';

    setTimeout(() => {
      notesMessage.innerHTML = "";
    }, 2000);

  });

</script>

</body>
</html>
